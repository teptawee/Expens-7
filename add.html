<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F8B195">
<title>➕ บันทึกรายการ | Money Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">💸 Money Tracker</div>
  <ul class="nav-links">
    <li><a href="index.html">📊 Dashboard</a></li>
    <li><a href="history.html">📜 ประวัติ</a></li>
    <li><a href="add.html" class="active">➕ บันทึก</a></li>
    <li><a href="settings.html">⚙️ ตั้งค่า</a></li>
  </ul>
</nav>

<main class="container narrow">

  <section class="card">
    <h2>➕ บันทึกรายการ</h2>

    <div class="mode-toggle" id="modeToggle">
      <button class="mode-btn active" data-mode="expense" type="button">💸 รายจ่าย</button>
      <button class="mode-btn" data-mode="income" type="button">💰 รายรับ</button>
    </div>

    <form id="txForm" class="form-grid">

      <div class="form-group">
        <label>📅 วันที่</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label>💵 จำนวนเงิน (บาท)</label>
        <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" required>
      </div>

      <div class="form-group full">
        <label>🏷️ หมวดหมู่</label>
        <div class="chips" id="categoryChips"></div>
        <input type="hidden" id="category" required>
      </div>

      <div class="form-group full">
        <label>💳 ประเภทการชำระ</label>
        <div class="chips" id="paymentChips"></div>
        <input type="hidden" id="payment" required>
      </div>

      <div class="form-group full">
        <label>📝 หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="note" placeholder="เช่น กาแฟเช้า, มื้อกลางวัน...">
      </div>

      <div class="form-group full">
        <button type="submit" class="btn btn-primary">💾 บันทึก</button>
      </div>
    </form>

    <div id="formStatus" class="status-msg"></div>
  </section>

</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/add.js"></script>
</body>
</html>
